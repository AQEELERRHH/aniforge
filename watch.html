<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AniForge — Watch</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@400;600;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0a0a0f;
    --paper: #f5f0e8;
    --ember: #ff4d1c;
    --ember2: #ff8c42;
    --steel: #1a1a2e;
    --glow: #00d4ff;
    --gold: #ffd700;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--ink);
    color: var(--paper);
    font-family: 'Nunito', sans-serif;
    min-height: 100vh;
  }

  /* NAV */
  nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1rem 3rem;
    border-bottom: 1px solid rgba(255,77,28,0.15);
    background: rgba(10,10,15,0.96);
    backdrop-filter: blur(20px);
    position: sticky;
    top: 0;
    z-index: 200;
  }

  .logo {
    font-family: 'Bebas Neue', cursive;
    font-size: 1.6rem;
    letter-spacing: 3px;
    background: linear-gradient(135deg, var(--ember), var(--ember2), var(--gold));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-decoration: none;
  }

  nav a.back {
    color: var(--paper);
    text-decoration: none;
    font-family: 'Space Mono', monospace;
    font-size: 0.78rem;
    opacity: 0.6;
    letter-spacing: 1px;
    transition: opacity 0.2s;
  }
  nav a.back:hover { opacity: 1; color: var(--ember); }

  /* PLAYER */
  .player {
    max-width: 1100px;
    margin: 0 auto;
    padding: 0 2rem 4rem;
  }

  /* STAGE - the main image + text area */
  .stage {
    position: relative;
    background: #000;
    border-radius: 0 0 8px 8px;
    overflow: hidden;
    aspect-ratio: 16/9;
    max-height: 580px;
  }

  .stage-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: opacity 0.5s ease;
  }

  .stage-bg-placeholder {
    width: 100%;
    height: 100%;
    background: linear-gradient(135deg, #1a0a2e, #0d1a3a, #2a0a1e);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Bebas Neue', cursive;
    font-size: 8vw;
    opacity: 0.1;
    position: absolute;
    inset: 0;
  }

  /* SCENE OVERLAY - bottom text box */
  .scene-overlay {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    background: linear-gradient(transparent, rgba(0,0,0,0.85) 30%);
    padding: 4rem 2.5rem 2rem;
    transition: opacity 0.3s;
  }

  .scene-location {
    font-family: 'Space Mono', monospace;
    font-size: 0.72rem;
    opacity: 0.5;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 0.7rem;
  }

  .scene-title-display {
    font-family: 'Bebas Neue', cursive;
    font-size: 1.4rem;
    letter-spacing: 2px;
    margin-bottom: 0.5rem;
    color: var(--ember2);
  }

  /* DIALOGUE BOX */
  .dialogue-box {
    background: rgba(10,10,15,0.88);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px;
    padding: 1.2rem 1.5rem;
    margin-top: 0.5rem;
    backdrop-filter: blur(10px);
    position: relative;
    cursor: pointer;
    max-height: 140px;
    overflow-y: auto;
  }

  .speaker-name {
    font-family: 'Bebas Neue', cursive;
    font-size: 1rem;
    letter-spacing: 2px;
    color: var(--ember2);
    margin-bottom: 0.3rem;
  }

  .speaker-name.narrator { color: var(--glow); font-style: italic; }

  .dialogue-text {
    font-size: 0.95rem;
    line-height: 1.6;
    overflow: hidden;
  }

  .click-hint {
    position: absolute;
    bottom: 0.6rem;
    right: 1rem;
    font-size: 0.7rem;
    opacity: 0.4;
    font-family: 'Space Mono', monospace;
    animation: blink 1.5s ease-in-out infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 0.8; }
  }

  /* CONTROLS BAR */
  .controls {
    background: var(--steel);
    padding: 1rem 2rem;
    display: flex;
    align-items: center;
    gap: 1.5rem;
    border-top: 1px solid rgba(255,255,255,0.06);
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }

  .ctrl-btn {
    background: transparent;
    border: 1px solid rgba(255,255,255,0.15);
    color: var(--paper);
    width: 40px;
    height: 40px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 1rem;
    transition: background 0.2s, border-color 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .ctrl-btn:hover { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.3); }
  .ctrl-btn.primary { background: var(--ember); border-color: var(--ember); font-size: 1.2rem; width: 48px; height: 48px; }
  .ctrl-btn.primary:hover { background: var(--ember2); border-color: var(--ember2); }

  .progress-track {
    flex: 1;
    height: 4px;
    background: rgba(255,255,255,0.1);
    border-radius: 2px;
    cursor: pointer;
    position: relative;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--ember), var(--ember2));
    border-radius: 2px;
    transition: width 0.3s;
  }

  .progress-dots {
    position: absolute;
    top: 50%;
    left: 0;
    right: 0;
    transform: translateY(-50%);
    display: flex;
    justify-content: space-between;
    pointer-events: none;
  }

  .progress-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: rgba(255,255,255,0.2);
    margin-top: -2px;
    transition: background 0.3s;
  }

  .progress-dot.active { background: var(--ember2); }
  .progress-dot.done { background: var(--ember); }

  .scene-counter {
    font-family: 'Space Mono', monospace;
    font-size: 0.78rem;
    opacity: 0.5;
    white-space: nowrap;
  }

  /* EPISODE INFO */
  .ep-info {
    padding: 2.5rem 0 2rem;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 2rem;
    align-items: start;
  }

  .ep-title-big {
    font-family: 'Bebas Neue', cursive;
    font-size: 2.5rem;
    letter-spacing: 3px;
    line-height: 1;
    margin-bottom: 0.8rem;
  }

  .ep-synopsis-read {
    font-size: 0.95rem;
    line-height: 1.7;
    opacity: 0.65;
    max-width: 600px;
  }

  .ep-actions {
    display: flex;
    flex-direction: column;
    gap: 0.8rem;
  }

  .vote-big {
    background: transparent;
    border: 1px solid var(--ember);
    color: var(--ember);
    padding: 0.7rem 1.5rem;
    border-radius: 4px;
    cursor: pointer;
    font-family: 'Bebas Neue', cursive;
    font-size: 1rem;
    letter-spacing: 2px;
    transition: background 0.2s;
  }
  .vote-big:hover { background: rgba(255,77,28,0.15); }

  .share-btn {
    background: transparent;
    border: 1px solid rgba(255,255,255,0.15);
    color: var(--paper);
    padding: 0.7rem 1.5rem;
    border-radius: 4px;
    cursor: pointer;
    font-family: 'Space Mono', monospace;
    font-size: 0.75rem;
    letter-spacing: 1px;
    transition: border-color 0.2s;
    text-align: center;
  }
  .share-btn:hover { border-color: rgba(255,255,255,0.4); }

  /* CAST STRIP */
  .cast-strip {
    margin-bottom: 2.5rem;
  }

  .strip-label {
    font-family: 'Space Mono', monospace;
    font-size: 0.72rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    opacity: 0.4;
    margin-bottom: 1rem;
  }

  .cast-scroll {
    display: flex;
    gap: 1rem;
    overflow-x: auto;
    padding-bottom: 0.5rem;
  }

  .cast-scroll::-webkit-scrollbar { height: 3px; }
  .cast-scroll::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); }
  .cast-scroll::-webkit-scrollbar-thumb { background: var(--ember); border-radius: 2px; }

  .cast-chip {
    flex-shrink: 0;
    background: var(--steel);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 40px;
    padding: 0.5rem 1rem;
    display: flex;
    align-items: center;
    gap: 0.6rem;
  }

  .cast-avatar-sm {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--ember), #2a0a1e);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Bebas Neue', cursive;
    font-size: 1rem;
    color: white;
    flex-shrink: 0;
    overflow: hidden;
  }

  .cast-avatar-sm img { width: 100%; height: 100%; object-fit: cover; }

  .cast-chip-name {
    font-size: 0.85rem;
    font-weight: 700;
  }

  .cast-chip-role {
    font-size: 0.7rem;
    opacity: 0.5;
    font-family: 'Space Mono', monospace;
  }

  /* SCENE THUMBNAILS */
  .scenes-row {
    margin-top: 2rem;
  }

  .thumbs-scroll {
    display: flex;
    gap: 0.8rem;
    overflow-x: auto;
    padding-bottom: 0.5rem;
  }

  .thumb-item {
    flex-shrink: 0;
    width: 120px;
    cursor: pointer;
    border-radius: 6px;
    overflow: hidden;
    border: 2px solid transparent;
    transition: border-color 0.2s, transform 0.2s;
  }

  .thumb-item:hover { transform: translateY(-2px); }
  .thumb-item.active { border-color: var(--ember); }

  .thumb-img {
    width: 100%;
    height: 70px;
    background: linear-gradient(135deg, #1a0a2e, #0d1a3a);
    object-fit: cover;
    display: block;
  }

  .thumb-label {
    background: var(--steel);
    padding: 0.3rem 0.5rem;
    font-size: 0.65rem;
    font-family: 'Space Mono', monospace;
    opacity: 0.7;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* NOT FOUND */
  .not-found {
    text-align: center;
    padding: 8rem 2rem;
    opacity: 0.5;
  }

  .not-found h2 {
    font-family: 'Bebas Neue', cursive;
    font-size: 2rem;
    letter-spacing: 3px;
    margin-bottom: 1rem;
  }

  .toast {
    position: fixed;
    bottom: 2rem;
    right: 2rem;
    background: var(--steel);
    border: 1px solid var(--ember);
    color: var(--paper);
    padding: 1rem 1.5rem;
    border-radius: 6px;
    font-family: 'Space Mono', monospace;
    font-size: 0.82rem;
    z-index: 999;
    transform: translateY(100px);
    opacity: 0;
    transition: transform 0.3s, opacity 0.3s;
    max-width: 300px;
  }
  .toast.show { transform: translateY(0); opacity: 1; }

  /* AUTO-PLAY BAR */
  .autoplay-bar {
    position: absolute;
    bottom: 0;
    left: 0;
    height: 3px;
    background: var(--glow);
    transition: width linear;
    width: 0%;
  }

  @media (max-width: 768px) {
    nav { padding: 0.8rem 1.5rem; }
    .player { padding: 0 0 3rem; }
    .controls { padding: 0.8rem 1rem; gap: 0.8rem; }
    .ep-info { grid-template-columns: 1fr; padding: 1.5rem 1rem; }
    .ep-title-big { font-size: 1.8rem; }
    .ep-actions { flex-direction: row; }
    .cast-strip, .scenes-row { padding: 0 1rem; }
  }
</style>
</head>
<body>

<nav>
  <a href="index.html" class="logo">AniForge</a>
  <a href="index.html" class="back">← All Episodes</a>
</nav>

<div class="player" id="player">
  <div id="not-found" class="not-found" style="display:none">
    <h2>Episode Not Found</h2>
    <p>This episode doesn't exist or was removed.</p>
    <br>
    <a href="index.html" style="color:var(--ember);font-family:'Space Mono',monospace;font-size:0.85rem;">← Back to Browse</a>
  </div>

  <!-- STAGE -->
  <div class="stage" id="stage" style="display:none">
    <div class="stage-bg-placeholder" id="bg-placeholder"></div>
    <img class="stage-img" id="stage-img" src="" alt="" style="opacity:0" onerror="this.style.opacity=0">

    <div class="scene-overlay" id="scene-overlay">
      <div class="scene-location" id="scene-location"></div>
      <div class="scene-title-display" id="scene-title-display"></div>
      <div class="dialogue-box" id="dialogue-box" onclick="nextLine()">
        <div class="speaker-name" id="speaker-name"></div>
        <div class="dialogue-text" id="dialogue-text"></div>
        <div class="click-hint" id="click-hint">▼ click to continue</div>
      </div>
    </div>

    <div class="autoplay-bar" id="autoplay-bar"></div>
  </div>

  <!-- CONTROLS -->
  <div class="controls" id="controls" style="display:none">
    <button class="ctrl-btn" onclick="prevScene()" title="Previous scene">◀</button>
    <button class="ctrl-btn primary" id="play-btn" onclick="toggleAuto()">⏸</button>
    <button class="ctrl-btn" onclick="nextScene()" title="Next scene">▶</button>

    <div class="progress-track" id="progress-track" onclick="seekScene(event)">
      <div class="progress-fill" id="progress-fill"></div>
      <div class="progress-dots" id="progress-dots"></div>
    </div>

    <span class="scene-counter" id="scene-counter">1 / 1</span>
  </div>

  <!-- EP INFO -->
  <div id="ep-info-section" style="display:none">
    <div class="ep-info">
      <div>
        <div class="ep-title-big" id="ep-title-big"></div>
        <div class="ep-synopsis-read" id="ep-synopsis-read"></div>
      </div>
      <div class="ep-actions">
        <button class="vote-big" id="vote-btn" onclick="voteEpisode()">♥ Like Episode</button>
        <button class="share-btn" onclick="shareEp()">🔗 Share</button>
        <a href="forge.html" style="text-decoration:none">
          <button class="share-btn" style="width:100%">⚡ Forge New</button>
        </a>
      </div>
    </div>

    <div class="cast-strip">
      <div class="strip-label">Cast</div>
      <div class="cast-scroll" id="cast-scroll"></div>
    </div>

    <div class="scenes-row">
      <div class="strip-label">All Scenes</div>
      <div class="thumbs-scroll" id="thumbs-scroll"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ============================================================
// STATE
// ============================================================
let episode = null;
let currentScene = 0;
let currentLine = 0; // 0 = narration, 1+ = dialogue lines
let autoPlaying = true;
let autoTimer = null;

// ============================================================
// INIT
// ============================================================
window.onload = () => {
  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');

  if (!id) { showNotFound(); return; }

  const episodes = JSON.parse(localStorage.getItem('aniforge_episodes') || '[]');
  episode = episodes.find(e => e.id === id);

  if (!episode) { showNotFound(); return; }

  // Track views
  episode.views = (episode.views || 0) + 1;
  localStorage.setItem('aniforge_episodes', JSON.stringify(episodes));

  document.title = `AniForge — ${episode.title}`;
  initPlayer();
};

function showNotFound() {
  document.getElementById('not-found').style.display = 'block';
}

function initPlayer() {
  const scenes = episode.scenes || [];
  if (scenes.length === 0) { showNotFound(); return; }

  // Show all UI
  document.getElementById('stage').style.display = 'block';
  document.getElementById('controls').style.display = 'flex';
  document.getElementById('ep-info-section').style.display = 'block';

  // Fill ep info
  document.getElementById('ep-title-big').textContent = episode.title;
  document.getElementById('ep-synopsis-read').textContent = episode.synopsis || '';
  document.getElementById('vote-btn').textContent = `♥ Like Episode (${episode.votes || 0})`;

  // Build cast
  const castScroll = document.getElementById('cast-scroll');
  castScroll.innerHTML = (episode.characters || []).map(c => `
    <div class="cast-chip">
      <div class="cast-avatar-sm">${c.name.charAt(0)}</div>
      <div>
        <div class="cast-chip-name">${c.name}</div>
        <div class="cast-chip-role">${c.role}</div>
      </div>
    </div>
  `).join('');

  // Build scene thumbnails
  const thumbsScroll = document.getElementById('thumbs-scroll');
  thumbsScroll.innerHTML = scenes.map((s, i) => `
    <div class="thumb-item ${i === 0 ? 'active' : ''}" id="thumb-${i}" onclick="goToScene(${i})">
      ${s.imageUrl
        ? `<img class="thumb-img" src="${s.imageUrl}" alt="Scene ${i+1}" onerror="this.style.display='none'">`
        : `<div class="thumb-img" style="background:linear-gradient(135deg,#1a0a2e,#0d1a3a);"></div>`
      }
      <div class="thumb-label">SC ${String(i+1).padStart(2,'0')} · ${s.title || ''}</div>
    </div>
  `).join('');

  // Build progress dots
  const dotsEl = document.getElementById('progress-dots');
  dotsEl.innerHTML = scenes.map((_, i) => `<div class="progress-dot" id="dot-${i}"></div>`).join('');

  // Render first scene
  renderScene(0);
  startAutoPlay();
}

// ============================================================
// SCENE RENDERING
// ============================================================
function renderScene(index) {
  const scenes = episode.scenes || [];
  if (index < 0 || index >= scenes.length) return;

  currentScene = index;
  currentLine = 0;
  const scene = scenes[index];

  // Update bg/image
  const stageImg = document.getElementById('stage-img');
  const bgPlaceholder = document.getElementById('bg-placeholder');

  if (scene.imageUrl) {
    stageImg.src = scene.imageUrl;
    stageImg.style.opacity = '1';
    bgPlaceholder.style.opacity = '0.05';
  } else {
    stageImg.style.opacity = '0';
    bgPlaceholder.style.opacity = '0.3';
    bgPlaceholder.textContent = String(index + 1).padStart(2,'0');
  }

  // Location / title
  document.getElementById('scene-location').textContent = scene.setting || '';
  document.getElementById('scene-title-display').textContent = scene.title || '';

  // Show narration first
  showLine(scene);

  // Update progress
  updateProgress(index);

  // Update thumbs
  document.querySelectorAll('.thumb-item').forEach((t, i) => {
    t.classList.toggle('active', i === index);
  });

  // Scroll thumb into view
  const thumb = document.getElementById('thumb-' + index);
  if (thumb) thumb.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
}

function showLine(scene) {
  const lines = buildLines(scene);
  if (currentLine >= lines.length) {
    nextScene();
    return;
  }

  const line = lines[currentLine];
  const speakerEl = document.getElementById('speaker-name');
  const textEl = document.getElementById('dialogue-text');

  speakerEl.textContent = line.speaker;
  speakerEl.className = 'speaker-name' + (line.speaker === 'NARRATOR' ? ' narrator' : '');
  textEl.textContent = '';

  // Typewriter effect
  let i = 0;
  const text = line.text;
  clearInterval(window._typeTimer);
  window._typeTimer = setInterval(() => {
    textEl.textContent += text[i];
    i++;
    if (i >= text.length) {
      clearInterval(window._typeTimer);
      document.getElementById('click-hint').style.opacity = currentLine < lines.length - 1 || currentScene < (episode.scenes||[]).length - 1 ? '0.5' : '0';
    }
  }, 20);
}

function buildLines(scene) {
  const lines = [];
  if (scene.narration) {
    lines.push({ speaker: 'NARRATOR', text: scene.narration });
  }
  (scene.dialogue || []).forEach(d => {
    lines.push({ speaker: (d.speaker || '').toUpperCase(), text: d.line || '' });
  });
  return lines;
}

function nextLine() {
  const scene = (episode.scenes || [])[currentScene];
  if (!scene) return;
  clearInterval(window._typeTimer);
  const lines = buildLines(scene);

  // If typewriter still running, complete it
  const textEl = document.getElementById('dialogue-text');
  if (textEl.textContent.length < lines[currentLine]?.text?.length) {
    textEl.textContent = lines[currentLine].text;
    return;
  }

  currentLine++;
  if (currentLine >= lines.length) {
    nextScene();
  } else {
    showLine(scene);
  }
}

function nextScene() {
  const scenes = episode.scenes || [];
  if (currentScene < scenes.length - 1) {
    renderScene(currentScene + 1);
  } else {
    showToast('🎬 Episode complete! Vote if you enjoyed it.');
    autoPlaying = false;
    document.getElementById('play-btn').textContent = '▶';
  }
}

function prevScene() {
  if (currentScene > 0) renderScene(currentScene - 1);
}

function goToScene(index) {
  clearAutoTimer();
  renderScene(index);
  if (autoPlaying) startAutoPlay();
}

// ============================================================
// AUTO PLAY
// ============================================================
function startAutoPlay() {
  clearAutoTimer();
  autoPlaying = true;
  document.getElementById('play-btn').textContent = '⏸';
  scheduleNextLine();
}

function scheduleNextLine() {
  clearAutoTimer();
  const scene = (episode.scenes || [])[currentScene];
  if (!scene) return;

  const lines = buildLines(scene);
  const currentLineText = lines[currentLine]?.text || '';
  const delay = Math.max(2500, currentLineText.length * 45);

  // Show progress bar countdown
  const bar = document.getElementById('autoplay-bar');
  bar.style.transition = 'none';
  bar.style.width = '0%';
  requestAnimationFrame(() => {
    bar.style.transition = `width ${delay}ms linear`;
    bar.style.width = '100%';
  });

  autoTimer = setTimeout(() => {
    if (!autoPlaying) return;
    nextLine();
    scheduleNextLine();
  }, delay);
}

function clearAutoTimer() {
  if (autoTimer) { clearTimeout(autoTimer); autoTimer = null; }
  const bar = document.getElementById('autoplay-bar');
  bar.style.transition = 'none';
  bar.style.width = '0%';
}

function toggleAuto() {
  if (autoPlaying) {
    autoPlaying = false;
    clearAutoTimer();
    document.getElementById('play-btn').textContent = '▶';
  } else {
    startAutoPlay();
  }
}

// ============================================================
// PROGRESS
// ============================================================
function updateProgress(sceneIndex) {
  const total = (episode.scenes || []).length;
  const pct = total > 1 ? (sceneIndex / (total - 1)) * 100 : 100;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('scene-counter').textContent = `${sceneIndex + 1} / ${total}`;

  for (let i = 0; i < total; i++) {
    const dot = document.getElementById('dot-' + i);
    if (!dot) continue;
    dot.classList.remove('active', 'done');
    if (i < sceneIndex) dot.classList.add('done');
    else if (i === sceneIndex) dot.classList.add('active');
  }
}

function seekScene(e) {
  const track = document.getElementById('progress-track');
  const rect = track.getBoundingClientRect();
  const pct = (e.clientX - rect.left) / rect.width;
  const total = (episode.scenes || []).length;
  const sceneIdx = Math.round(pct * (total - 1));
  goToScene(Math.max(0, Math.min(total - 1, sceneIdx)));
}

// ============================================================
// VOTE
// ============================================================
function voteEpisode() {
  const episodes = JSON.parse(localStorage.getItem('aniforge_episodes') || '[]');
  const ep = episodes.find(e => e.id === episode.id);
  if (!ep) return;
  ep.votes = (ep.votes || 0) + 1;
  episode.votes = ep.votes;
  localStorage.setItem('aniforge_episodes', JSON.stringify(episodes));
  document.getElementById('vote-btn').textContent = `♥ Liked! (${ep.votes})`;
  showToast('❤️ Thanks for your vote!');
}

function shareEp() {
  const url = window.location.href;
  if (navigator.clipboard) {
    navigator.clipboard.writeText(url);
    showToast('🔗 Link copied!');
  }
}

// ============================================================
// TOAST
// ============================================================
function showToast(msg, duration = 3500) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), duration);
}

// Keyboard nav
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); nextLine(); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); prevScene(); }
  if (e.key === 'p' || e.key === 'P') toggleAuto();
});
</script>
